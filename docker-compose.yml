services:
  rss-bridge:
    container_name: rss-bridge
    build: .
#    image: rssbridge/rss-bridge:latest
    volumes:
      - ./config:/config
    ports:
      - 4000:80
    environment:
      # update-perplexity.php refuses to write without it. Value lives in .env
      # next to this file (0600, not committed).
      - PERPLEXITY_UPDATE_TOKEN=${PERPLEXITY_UPDATE_TOKEN:-}
      # - PERPLEXITY_API_KEY=pplx-your-api-key-here
    restart: unless-stopped

# Pinned: rss-bridge-egress.service (my.jru.me) routes this subnet's internet
# traffic via wg0 -> Fritz!Box, because Cloudflare blocks the datacenter IP.
networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
