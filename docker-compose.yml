services:
  rss-bridge:
    container_name: rss-bridge
    build: .
#    image: rssbridge/rss-bridge:latest
    volumes:
      - ./config:/config
    ports:
      - 4000:80
    # Environment variables for bridge configuration
    # Uncomment and set your API keys here (or use .env file)
    # environment:
    #   - PERPLEXITY_API_KEY=pplx-your-api-key-here
    restart: unless-stopped

# Pinned: rss-bridge-egress.service (my.jru.me) routes this subnet's internet
# traffic via wg0 -> Fritz!Box, because Cloudflare blocks the datacenter IP.
networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
